name: inspraak

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inspraak
      # Set POSTGRES_PASSWORD in the shell or a compose .env before the first start; the
      # default only suits a local machine (the port is bound to 127.0.0.1 below).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspraak}
      POSTGRES_DB: inspraak
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspraak -d inspraak"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # api, worker and beat run the checked-out code from the uv image: the first start
  # syncs the environment into a named volume (a few minutes), later starts are quick.
  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - api_venv:/opt/venv
      - uv_cache:/root/.cache/uv
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inspraak:${POSTGRES_PASSWORD:-inspraak}@postgres:5432/inspraak
      REDIS_URL: redis://redis:6379/0
      UV_PROJECT_ENVIRONMENT: /opt/venv
    # migrations are idempotent, so a clean database gets its schema on the first start
    command: sh -c "uv run inspraak db migrate && exec uv run inspraak web --host 0.0.0.0 --port 8010"
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - worker_venv:/opt/venv
      - uv_cache:/root/.cache/uv
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inspraak:${POSTGRES_PASSWORD:-inspraak}@postgres:5432/inspraak
      REDIS_URL: redis://redis:6379/0
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: uv run celery -A inspraak.queue worker -Q brief,nightly -l info --concurrency 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]

  beat:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - beat_venv:/opt/venv
      - uv_cache:/root/.cache/uv
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inspraak:${POSTGRES_PASSWORD:-inspraak}@postgres:5432/inspraak
      REDIS_URL: redis://redis:6379/0
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: uv run celery -A inspraak.queue beat -l info
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["workers"]

  # `docker compose up` starts postgres, redis and the api on http://localhost:8010.
  # `docker compose --profile workers up` adds the worker and beat; without the profile
  # `make worker` / `make beat` run them on the host and the api falls back to inline
  # runs when no broker consumer is there.

volumes:
  pgdata:
  api_venv:
  worker_venv:
  beat_venv:
  uv_cache:
