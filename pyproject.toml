[project]
name = "inspraak"
version = "0.1.0"
description = "Consultation desk for Brussels organisations: Have Your Say, Transparency Register and Commission meetings in one page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kaan Goker" }]
dependencies = [
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "google-genai>=1.20",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "lxml>=5.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "redis>=5",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
inspraak = "inspraak.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspraak"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container from docker compose"]
