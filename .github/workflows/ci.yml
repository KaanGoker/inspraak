name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inspraak
          POSTGRES_PASSWORD: inspraak
          POSTGRES_DB: inspraak
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U inspraak -d inspraak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://inspraak:inspraak@localhost:5544/inspraak
      REDIS_URL: redis://localhost:6390/0
      LLM_PROVIDER: fake
      RUN_INLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check inspraak tests scripts
          uv run ruff format --check inspraak tests scripts
      - name: Migrate
        run: uv run inspraak db migrate
      - name: Test
        run: uv run pytest -q
